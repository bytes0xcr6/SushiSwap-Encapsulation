[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
gas_reports = ["SushiWallet", "*"]

[profile.default.fuzz]
runs = 256

[profile.default.coverage]
via_ir = true

[rpc_endpoints]
arbitrum = "${ARBITRUM_RPC_URL}"

[etherscan]
arbitrum = { key = "${ARBISCAN_API_KEY}", url = "${ARBISCAN_URL}" }

[fmt]
number_underscore = "thousands"
